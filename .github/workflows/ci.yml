# CI workflow for aspirant-* Python services WITH a database dependency.
#
# Variants (documented in CONVENTIONS.md):
#   - Python + DB (this file)     — services that use SQLAlchemy/PostgreSQL
#   - Python stateless            — remove the `services:` block, use setup-python + pip install
#   - Go                          — replace test job with setup-go + go test ./...
#   - Vue/client                  — no test job, build-and-push only
#
# To adapt: copy this file into your repo's .github/workflows/ci.yml and
# adjust the test job to match your service type.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r requirements.txt pytest
    - name: Run tests
      env:
        DB_HOST: localhost
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_NAME: test_db
      run: pytest tests/ -v

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    # Image builds of one ref run one at a time, newest last, so two merges
    # landing seconds apart cannot push :latest out of commit order (system_3
    # #9966). On this job only: test runs, PR or main, are not queued.
    concurrency:
      group: build-image-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    # The concurrency group above orders main's image builds, but a re-run of
    # an older commit joins the same queue and would still retag :latest with
    # it, rolling the deploy back. So the moving tags (:latest, :main) go only
    # on a build of the commit that is main's head right now; any other build
    # still pushes its sha- tag. If the head cannot be read, the build fails
    # rather than guessing (system_3 #9966/#9984; aspirant-client #409).
    - name: Is this commit main's head?
      id: head
      run: bash scripts/is-main-head.sh "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch,enable=${{ steps.head.outputs.is_head == 'true' }}
          type=sha
          type=raw,value=latest,enable=${{ steps.head.outputs.is_head == 'true' }}
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile-Advisor
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
